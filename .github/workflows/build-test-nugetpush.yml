name: .NET build, publish and nuget push

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

  integration-tests:
    needs: build
    uses: ./.github/workflows/integration-tests.yml
    with:
      dotnet-version: '11.0.x'
    secrets:
      GOOGLE_AUTH_JSON: ${{ secrets.GOOGLE_AUTH_JSON }}

  publish:
    needs: integration-tests
    if: startsWith(github.ref, 'refs/tags/v') && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: mrshrinkray

    - name: Pack and push the tag package
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        dotnet pack src/CloudFileStore/CloudFileStore.csproj -c Release /p:PackageVersion=$VERSION
        dotnet nuget push "src/CloudFileStore/bin/Release/CloudFileStore.$VERSION.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
